# BasketVibe — config (gabarit : _modele.yaml ; attentes : ../attentes.md)

jeu:
  id: basketvibe
  nom: BasketVibe
  sport: basket
  prefixe_sql: bv_
  fuseau_affichage: Europe/Paris

equipes:
  - { id: chomelix, nom: Chomelix Cow, niveau: senior, controle: [composition, entrainement, transferts, academie, personnel] }

ligue: { taille: 12, division: , montee_descente: "voir skill basketvibe-saison" }

unites_echelles:
  devise: monnaie du jeu
  competences: { nombre: 8, echelle: "0–100" }
  forme: "1–10"
  conversion_base_ecran: "consignes : base 0–4 = écran 1–5 (+1)"

jugement_joueur: [fit au poste, forme, fatigue, stats]

sources:
  manuel: https://www.basketvibe.com/guide
  devlog: https://www.basketvibe.com/devlog
  discord: data/discord/basketvibe/
  forum: null
  chat: null
  connaissance: outputs/basketvibe/veille/connaissance.md   # à créer (veille intégrale)

exports_texte:
  - { type: discord, canal: export manuel, frequence: hebdomadaire, destination: data/discord/basketvibe/, declenche: [veille] }

rythme:
  - { quand: lundi mercredi samedi, quoi: match de ligue 20:00, verrouillage: "19:45", fuseau_heure: ligue }   # à vérifier : fuseau de la ligue = Paris ?
  - { quand: chaque jour, quoi: amical 08:00 (domicile ou extérieur), verrouillage: "07:45", fuseau_heure: hôte }
  - { quand: dimanche 04:00, quoi: entraînement, salaires, personnel facturé, fuseau_heure: Paris }
  - { quand: jeudi 09:00, quoi: rapport d'académie, fuseau_heure: Paris }
  - { quand: fin de saison, quoi: "+1 an pour tous les joueurs" }

competitions:
  ligue:  { saisie: oui, preset: adversaire, moteur: "v3 jusqu'au 26/10, v4 dès la saison 2", but: gagner }
  coupe:  { saisie: oui, preset: adversaire, but: gagner }   # utilisateur 2026-11-17 : preset de l'adversaire (voir ses joueurs), puis zone et focus défensif ; plus de preset « League Tactic » à re-sélectionner
  amical: { saisie: oui, preset: non, moteur: v4, but: tester }  # utilisateur 2026-10-27 : pas de preset à enregistrer, mais composition complète (tableau joueur × quart-temps) et réglages de test (zone Rim…) à saisir sur la page du match ; remplace la consigne du 2026-10-26 « ni preset ni saisie »

ecrans:
  composition:
    lignes: [Q1, Q2, Q3, Q4, OT]
    colonnes: [PG, SG, SF, PF, C]
    ordre_joueurs: "par poste PG-SG-SF-PF-C, puis alphabétique"
    depth_chart: "2 ou 3 remplaçants par emplacement"
  consignes_joueur:
    colonnes: [joueur, role, offensive focus, shooting focus, defense]   # à vérifier sur l'écran : 3 ordres différents dans les notes
    valeurs_permises:
      role: "1 Passeur → 5 Scoreur"
      offensive focus: "1 Low → 5 Primary"
      shooting focus: "1 = 2 pts → 5 = 3 pts"
      defense: "1 soft → 5 agressif"
  focus_defensif:
    colonnes: [joueur adverse, focus]
    valeurs_permises: { focus: "1 Give up, 2 Light, 3 Normal, 4 Intense, 5 Lock (export : off)" }
  defensive_area:
    colonnes: [joueur adverse, zone]
    valeurs_permises: { zone: [Rim, Perimeter, Neutral] }   # amicaux v4 ; « Middle » vu une fois, à vérifier à l'écran

options_a_tester:
  - "role_tier, shot_tier, offensive_focus_tier : effet en match, un seul à la fois, en amical"

exports:
  - { page: match,             quand: après chaque match,        evenement: export_match }
  - { page: roster,            quand: après chaque match,        evenement: export_roster }
  - { page: preview,           quand: avant un match de ligue,   evenement: export_roster }
  - { page: training,          quand: dimanche après 04:00,      evenement: export_entrainement }
  - { page: finance,           quand: dimanche après 04:00,      evenement: export_finances }
  - { page: personnel,         quand: dimanche après 04:00,      evenement: export_finances }
  - { page: academy,           quand: jeudi après 09:00,         evenement: export_academie, page_typee_reelle: "parfois la page finances (26/10)", apres_export: "lire gold.bv_academy_chat depuis le dernier rapport (carte academie)" }
  - { page: transfers,         quand: si plus de 24 h,           evenement: export_marche }
  - { page: transfers_global-history, quand: avec le marché,     evenement: export_marche }

domaines:
  equipe:          { present: oui }
  tactique:        { present: oui }
  entrainement:    { present: oui, dimensions: [principale, secondaire], frequence: hebdomadaire }
  jeunes:          { present: oui, depense_suivie: oui, specificites: "jauge 0–100 %, investissement hebdo jusqu'à 100 000, test de potentiel 25 000, recrutement −50 % de jauge" }
  transferts:      { present: oui, taxe: "5 %", delai_revente: "1 semaine", minimum_effectif: 8, base_historique: transfers_global-history }   # 8 = règle du jeu ; 9 = notre marge de sécurité
  finances:        { present: oui, sponsor: "un contrat par saison" }

# Phase A (17/11, règles de l'utilisateur) : offres et ventes du jour, lues par pipelines/etat_jour.py (jamais en dur dans le code).
# Case = tranche d'âge × palier de note de 5 (table des prix du bloc 4, gold.bv_price_ref_ps). Utilisé = a joué sur les
# `matchs_rotation` derniers matchs de ligue ; hors rotation = moyenne de minutes ≤ `minutes_hors_rotation` sur ces matchs.
# Seuil de signature d'un prospect testé (décidé par Claude le 18/11, contestable par l'utilisateur ; docs/regles-utilisateur.md).
# « Meilleures compétences au poste » : sur la fourchette de PS du test (refined_skill_brackets × gold.bv_ps_weight),
# borne basse ≥ PS le plus faible de l'effectif au poste (gold.bv_roster_now : aucune vue de rotation, l'effectif en tient lieu)
# ET borne haute ≥ PS du meilleur au poste − marge_haute ; potentiel high seulement. Aucun high observé le 18/11 : à recalibrer au premier.
# Seuil décidé par Claude le 18/11 (jamais « aucun seuil écrit par l'utilisateur », jamais « à juger »). « Meilleures caractéristiques du
# poste » = fourchette de PS du test (gold.bv_ps_weight) : borne basse ≥ PS du joueur de ROTATION le plus faible au poste (minutes en
# ligue > 0 sur les 4 derniers matchs) ET borne haute ≥ PS du meilleur du poste − marge_haute ; potentiel high seulement.
academie_signature:
  potentiel: high
  marge_haute: 5
offres:
  matchs_rotation: 4
  case_min_ventes: 3
  gain_ajustement_min: 1.0            # 19/11 : amélioration = gain d'ajustement au poste (gold.bv_slot_fit) sur notre titulaire ≥ 1,0 point
  revente_marge: 1.25
  minutes_hors_rotation: 6
  max_offres: 3
  max_ventes: 2
  vente_marge_profit: 0.25   # vente pour profit : (prix attendu − prix payé) / prix payé ≥ 25 % quand le prix payé est connu
  # 18/11, règle de l'utilisateur (docs/regles-utilisateur.md) : titulaires de tout âge, remplaçants de 16 à 18 ans à fort potentiel.
  # Hors titulaire : enchère seulement pour un 16-18 ans testé High ; sans test connu, « tester le potentiel » (25 000, cout_test
  # de evenements.academie) au plus tests_par_jour fois et tests_budget au total par jour.
  jeune_age_min: 16
  jeune_age_max: 18
  tests_par_jour: 1                   # 19/11 : 1 test par jour, 25 000 au total
  tests_budget: 25000

# Phase A.5 (17/11) : règle de personnel DÉCIDÉE par Claude le 17/11, contestable par l'utilisateur ; le plan n'affiche une ligne
# Personnel que si gold.bv_personnel_status s'en écarte (etat_jour.texte_personnel).
# Effets et coûts : skill basketvibe-economie (03-depenses.md, [M§4.3]). Données du 16/11 : gold.bv_personnel_status (semaine du 02/11),
# gold.bv_finance_health (personnel 60 000 / semaine, recettes récurrentes 557 206 / semaine, popularité 0,66), silver.bv_match_events
# (36 blessures en base).
# Mesures du 17/11 (17:05, Paris) : forme moyenne des 10 joueurs utilisés sur les 4 derniers matchs de ligue (gold.bv_roster_now,
# gold.bv_match_player_lines) = 7,2 (min 5, max 9) < 8 → psychologues 2. Blessures de NOTRE équipe cette saison : 3 (3 joueurs de
# l'effectif actuel, silver.bv_match_events) ; jours perdus non mesurables (aucune date de retour historisée ; gold.bv_blessures_match
# et gold.bv_roster_now : 0 blessé aujourd'hui).
personnel_propose:
  statut: "décidée par Claude le 17/11, contestable par l'utilisateur"
  regle_psychologue: { mesure: forme moyenne des joueurs utilisés sur les 4 derniers matchs de ligue, seuil: 8, si_atteint: 0, sinon: 2, mesure_17_11: 7.2 }
  plafond_semaine: 85000
  roles:
    - { role: médecin,          garder: 2, cout_unitaire: 10000, raison: "−25 % de durée de blessure chacun ; 36 blessures en base, en ligue seulement" }
    - { role: kinésithérapeute, garder: 4, cout_unitaire: 5000,  raison: "−12,5 % de risque chacun, compté au coup d'envoi ; le moins cher par effet" }
    - { role: psychologue,      garder: 2, cout_unitaire: 10000, raison: "forme moyenne 7,2 < 8 sur les 4 derniers matchs de ligue (17/11) ; +5 pts vers la hausse de forme du dimanche chacun" }
    - { role: marketing,        garder: 0, cout_unitaire: 12500, raison: "1 % de popularité = 80 spectateurs × 50 = 4 000 par match à domicile ; deux spécialistes (25 000 par semaine) n'évitent que 2 points par défaite à domicile" }
  personnel:       { present: oui, postes: [médecins, kinés, psychologues, marketing], facturation: "maximum atteint dans la semaine (dev 2026-09-14 ; 85 000 contre 60 000 le 25/10, à confirmer le 01/11)" }
  infrastructures: { present: non }

core:   # refonte v2 phase 1 : entités branchées (adapt.basketvibe_<entité>) ; limites = colonnes nulles par construction
  player_daily:  { limites: [morale, suspended, contract_end, market_value] }   # absents de la collecte
  fixture:       { limites: [] }                                                 # scheduled_at : amicaux programmés seulement (fuseau de kickoff_time non sourcé)
  standing:      { limites: [] }
  finance_daily: { limites: [income, wage_cap, capacite_invest] }                # recettes non relevées ; aucun plafond dans les skills ; capacité calculée en gold
  market_listing: { limites: [] }                                                # enchères vues (marché et mes ventes) ; statut figé au dernier relevé
  academy_prospect: { limites: [potential_min, potential_max] }                  # rapport du scout ; potentiel caché non affiché ; tous « candidat » (signatures non collectées)
  staff:         { limites: [level, salary] }                                    # API Personnel : noms par rôle ; pas de niveau ; coût par poste dans le skill [M§4.3]
  training_plan: { limites: [intensity] }                                        # pas d'intensité dans le jeu

vues_gold:
  agenda: gold.bv_agenda
  alertes: gold.bv_daily_alerts
  rapport_match: gold.bv_match_report
  saisie_tactique: [gold.bv_saisie_joueurs, gold.bv_saisie_adversaires]   # R-10, ordre de l'écran, ligue/coupe/amical
  base_transferts: null          # à créer
  resultat_champ: my_result

specificites:
  - { regle: "Ligue et amicaux non comparables : fatigue et expérience d'un amical ≈ 1/10", source: "manuel M§1.2", statut: confirmé }
  - { regle: "Ne pas mélanger v3 et v4 dans les tendances", source: "news 2026-10-19", statut: confirmé }
  - { regle: "Re-sélectionner le preset sur chaque match de ligue déjà planifié", source: "fiche tactique", statut: confirmé }

# P2 du plan v4 (13/11) : état calculé par événement (pipelines/etat_jour.py). Le moteur lit ces types et ces états ;
# aucun nom de joueur, de match ou d'adversaire n'est écrit dans le code.
etat_jour:
  horizon_h: 48                # événements à venir pris en compte
  urgent_h: 24                 # échéance plus proche = priorité 1
  donnee_perimee_h: 24         # donnée plus vieille = priorité dégradée d'un cran
  jours_non_analyses: 7        # un match joué non analysé garde sa ligne pendant cette fenêtre
  minutes_max: 36              # contrôle fiche : minutes par joueur (règle de l'utilisateur, plan v4)
  fatigue_signal: 22           # 25/11 (règle de l'utilisateur) : fatigue estimée au coup d'envoi signalée seulement au-dessus de 22
  duree_match_h: 2             # après le coup d'envoi + cette durée, un match non marqué joué demande sa page
  matchs:
    ligue:  { etats: [calendrier, apercu, fiche, ecran, verrou, joue, analyse, juge], analyse_si: [L], ecran_contre_fiche: oui, controle_fatigue: oui, export_ecran_avant_verrou: oui,
              coup_envoi_defaut: "20:00", verrou_defaut: "19:45" }   # heures de la section rythme quand core.fixture n'en a pas
    coupe:  { etats: [calendrier, apercu, fiche, ecran, verrou, joue, analyse, juge], analyse_si: [L], ecran_contre_fiche: oui, controle_fatigue: oui, export_ecran_avant_verrou: oui }
    amical: { etats: [calendrier, fiche, ecran, verrou, joue], analyse_si: [], e1_uniforme: oui, libelle: "match amical" }   # jamais d'aperçu ni d'export avant le match
  # Décision de l'utilisateur du 17/11 : le plan demande TOUJOURS le Marché (toutes les pages) et l'historique global des transferts
  # (bonnes offres), et le Personnel une fois par semaine. Âge : gold.bv_exports_state (core.export_rule, 24 h / 168 h) ou, pour
  # l'historique (aucun écran dédié), la dernière page `transfers_global-history` de bronze.raw_pages.
  exports_periodiques:
    - { ecran: "Marché (enchères)", libelle: "le Marché (toutes les pages)", source: exports_state, periode: quotidien, perime_h: 24 }
    - { ecran: "Historique global des transferts", libelle: "l'historique global des transferts", source: page_type, page_type: transfers_global-history, periode: quotidien, perime_h: 24 }
    - { ecran: "Personnel", libelle: "la page Personnel", source: exports_state, periode: hebdomadaire, perime_h: 168 }
    # 19/11 (consigne de l'utilisateur ; la police les réclame) : Équipe (effectif, salaires, contrats) chaque semaine ; Mes enchères
    # seulement s'il y a une enchère ouverte (core.market_listing) ou une ligne d'enchère proposée (la capacité en dépend), périmé après 24 h.
    - { ecran: "Équipe (aperçu, joueurs)", libelle: "la page Équipe (effectif, salaires, contrats)", source: exports_state, periode: hebdomadaire, perime_h: 168 }
    - { ecran: "Mes enchères", libelle: "la page Mes enchères", source: exports_state, periode: si_enchere, perime_h: 24, si: enchere }
    # 19/11 (consigne de l'utilisateur ; études Match Engine des 11/11 et 18/11) : classement des trois ligues après chaque journée
    # (périmé si la dernière capture de /leagues/<id>/seasons/<s>/standings précède le coup d'envoi du dernier match de ligue joué) ;
    # les trois ligues = celles des clubs de silver.bv_club_roster (requête du 19/11 : 12 clubs chacune).
    - { ecran: "Classement Tier 3 - League 13", libelle: "le Classement de ma ligue (Tier 3 - League 13)", source: classement, league_id: 5fdd980c-032b-4ea3-b608-5eadc0c61f44, periode: journee }
    - { ecran: "Classement Tier 2 - League 4", libelle: "le Classement de la Tier 2 - League 4", source: classement, league_id: 45caebc5-824f-4d86-85e5-e8956e8cac6a, periode: journee }
    - { ecran: "Classement Premier League", libelle: "le Classement de l'European Premier League", source: classement, league_id: a7250ea5-b8b1-4e1d-87c2-020b4572412e, periode: journee }
    # 19/11 : onglets Équipes, Joueurs et Blessés de ma ligue chaque semaine (anciens exports hebdo de que_faire_blocs.HEBDO, perdus en v4)
    - { ecran: "Ligue — Équipes", libelle: "l'onglet Équipes de ma ligue", source: page_type, page_type: standings_teams, periode: hebdomadaire, perime_h: 168 }
    - { ecran: "Ligue — Joueurs", libelle: "l'onglet Joueurs de ma ligue", source: page_type, page_type: standings_players, periode: hebdomadaire, perime_h: 168 }
    - { ecran: "Ligue — Blessés", libelle: "l'onglet Blessés de ma ligue", source: page_type, page_type: standings_injuries, periode: hebdomadaire, perime_h: 168 }
  # 19/11 : matchs de ma ligue joués hier (pas les miens) sans onglets Details (preview « finished ») et Stats par quart (period-box)
  # en base ; liste dans outputs/basketvibe/<dossier>/ligue-<date des matchs>.md, du plus ancien au plus récent, plafond par jour.
  matchs_ligue: { plafond_jour: 8, objectif_etude: 150, dossier: exports-a-faire }
  evenements:
    academie:    { quand: "jeudi 09:00", etats: [rapport_attendu, rapport_exporte, teste, decide], jours_decision: 7, cout_test: 25000 }   # tests à 25 000 : skill basketvibe-academie, fiche academie.md
    entrainement: { quand: "dimanche 04:00", etats: [traitement_attendu, page_exportee, saisi] }
    enchere:      { etats: [police, fin, resultat] }
  # P3 (17/11) : état de l'événement → agent à lancer → sortie attendue. UNE table, lue par etat_jour.agents_a_lancer ; une ligne
  # s'applique si chacune de ses clés type / genre / prochain égale celle de l'état. agent null = aucun agent (action manuelle).
  # sortie : relative à outputs/basketvibe/ ; champs {jour} (AAAA-MM-JJ du passage), {cle} (adversaire ou objet + date), {titre}.
  # Une sortie déjà présente = pas de relance. avant : commande à réussir avant le lancement (règle 6 : dossier puis police).
  agents:
    # 24/11 : ligue et coupe — lire le brief analyste le plus récent (briefs/*-analyste-*.md) et appliquer chacune de ses corrections ;
    # contrôle SQL des 20 emplacements (5 postes × 4 quarts), de la fatigue (gold.bv_roster_now) et du fit (gold.bv_slot_fit) avant d'écrire
    - { type: match, genre: ligue,  prochain: fiche,   agent: tactique,  sortie: "briefs/{jour}-tactique-{cle}.md",        consigne: "première ligne du fichier : « {titre} » ; forme : que_faire_blocs.FORME_FICHE (À saisir, vérifie, exporter, ---, Annexe) ; écrans 1, 2 et 3 ; lis le brief analyste le plus récent de briefs/ et applique chacune de ses corrections ; contrôle SQL des 20 emplacements, de la fatigue et du fit avant d'écrire ; réponse : le chemin du fichier, une ligne" }
    - { type: match, genre: coupe,  prochain: fiche,   agent: tactique,  sortie: "briefs/{jour}-tactique-coupe-{cle}.md",  consigne: "première ligne du fichier : « {titre} » ; forme : que_faire_blocs.FORME_FICHE (À saisir, vérifie, exporter, ---, Annexe) ; écrans 1, 2 et 3 ; lis le brief analyste le plus récent de briefs/ et applique chacune de ses corrections ; contrôle SQL des 20 emplacements, de la fatigue et du fit avant d'écrire ; réponse : le chemin du fichier, une ligne" }
    - { type: match, genre: amical, prochain: fiche,   agent: tactique,  sortie: "briefs/{jour}-tactique-amical-{cle}.md", consigne: "première ligne du fichier : « {titre} » ; forme : que_faire_blocs.FORME_FICHE (À saisir, vérifie, exporter, ---, Annexe) ; réponse : le chemin du fichier, une ligne" }
    - { type: match, genre: ligue,  prochain: analyse, agent: analyste,  sortie: "briefs/{jour}-analyste-{cle}.md" }
    - { type: match, genre: coupe,  prochain: analyse, agent: analyste,  sortie: "briefs/{jour}-analyste-{cle}.md" }
    - { type: match,                prochain: juge,    agent: null }      # python -I pipelines/evaluer_decisions.py, pas d'agent
    - { type: academie,             prochain: decide,  agent: academie,  sortie: "briefs/{jour}-academie-{cle}.md" }
    # 22/11 : le rapport du 19/11 restait à l'état « teste » (tests à faire) et n'a jamais lancé l'agent ; rapport plus récent que le dernier brief -> agent
    - { type: academie,             prochain: teste,   agent: academie,  sortie: "briefs/{jour}-academie-{cle}.md", consigne: "section « ## Verdict par prospect » : un tableau (prospect | potentiel | progression | trou comblé | verdict : tester, signer, ignorer ou attendre), une ligne par prospect" }
    - { type: entrainement,         prochain: saisi,   agent: entrainement, sortie: "briefs/{jour}-entrainement-{cle}.md" }
    - { type: enchere,              prochain: police,  agent: police,    sortie: "police-{jour}.md", avant: "python -I pipelines/dossier.py basketvibe achat" }
  agents_plafond: 3                       # agents d'analyse par passage (CLAUDE.md), hors ceux de agents_hors_plafond
  agents_hors_plafond: [analyste, police, tactique]  # 23/11 : 3 fiches tactiques avaient rempli le plafond et bloqué l académie
  agent_timeout_min: 15
