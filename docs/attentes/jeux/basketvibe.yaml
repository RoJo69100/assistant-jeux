# BasketVibe — config (gabarit : _modele.yaml ; attentes : ../attentes.md)

jeu:
  id: basketvibe
  nom: BasketVibe
  sport: basket
  prefixe_sql: bv_
  fuseau_affichage: Europe/Paris

equipes:
  - { id: chomelix, nom: Chomelix Cow, niveau: senior, controle: [composition, entrainement, transferts, academie, personnel] }

ligue: { taille: 12, division: , montee_descente: "voir skill basketvibe-saison" }

unites_echelles:
  devise: monnaie du jeu
  competences: { nombre: 8, echelle: "0–100" }
  forme: "1–10"
  conversion_base_ecran: "consignes : base 0–4 = écran 1–5 (+1)"

jugement_joueur: [fit au poste, forme, fatigue, stats]

sources:
  manuel: https://www.basketvibe.com/guide
  devlog: https://www.basketvibe.com/devlog
  discord: data/discord/basketvibe/
  forum: null
  chat: null
  connaissance: outputs/basketvibe/veille/connaissance.md   # à créer (veille intégrale)

exports_texte:
  - { type: discord, canal: export manuel, frequence: hebdomadaire, destination: data/discord/basketvibe/, declenche: [veille] }

rythme:
  - { quand: lundi mercredi samedi, quoi: match de ligue 20:00, verrouillage: "19:45", fuseau_heure: ligue }   # à vérifier : fuseau de la ligue = Paris ?
  - { quand: chaque jour, quoi: amical 08:00 (domicile ou extérieur), verrouillage: "07:45", fuseau_heure: hôte }
  - { quand: dimanche 04:00, quoi: entraînement, salaires, personnel facturé, fuseau_heure: Paris }
  - { quand: jeudi 09:00, quoi: rapport d'académie, fuseau_heure: Paris }
  - { quand: fin de saison, quoi: "+1 an pour tous les joueurs" }

competitions:
  ligue:  { saisie: oui, preset: League Tactic, moteur: "v3 jusqu'au 26/10, v4 dès la saison 2", but: gagner }
  coupe:  { saisie: oui, preset: League Tactic, but: gagner }   # à vérifier : vu sur un seul export (26/10)
  amical: { saisie: oui, preset: non, moteur: v4, but: tester }  # utilisateur 2026-10-27 : pas de preset à enregistrer, mais composition complète (tableau joueur × quart-temps) et réglages de test (zone Rim…) à saisir sur la page du match ; remplace la consigne du 2026-10-26 « ni preset ni saisie »

ecrans:
  composition:
    lignes: [Q1, Q2, Q3, Q4, OT]
    colonnes: [PG, SG, SF, PF, C]
    ordre_joueurs: "par poste PG-SG-SF-PF-C, puis alphabétique"
    depth_chart: "2 ou 3 remplaçants par emplacement"
  consignes_joueur:
    colonnes: [joueur, role, offensive focus, shooting focus, defense]   # à vérifier sur l'écran : 3 ordres différents dans les notes
    valeurs_permises:
      role: "1 Passeur → 5 Scoreur"
      offensive focus: "1 Low → 5 Primary"
      shooting focus: "1 = 2 pts → 5 = 3 pts"
      defense: "1 soft → 5 agressif"
  focus_defensif:
    colonnes: [joueur adverse, focus]
    valeurs_permises: { focus: "1 Give up, 2 Light, 3 Normal, 4 Intense, 5 Lock (export : off)" }
  defensive_area:
    colonnes: [joueur adverse, zone]
    valeurs_permises: { zone: [Rim, Perimeter, Neutral] }   # amicaux v4 ; « Middle » vu une fois, à vérifier à l'écran

options_a_tester:
  - "role_tier, shot_tier, offensive_focus_tier : effet en match, un seul à la fois, en amical"

exports:
  - { page: match,             quand: après chaque match,        evenement: export_match }
  - { page: roster,            quand: après chaque match,        evenement: export_roster }
  - { page: preview,           quand: avant un match de ligue,   evenement: export_roster }
  - { page: training,          quand: dimanche après 04:00,      evenement: export_entrainement }
  - { page: finance,           quand: dimanche après 04:00,      evenement: export_finances }
  - { page: personnel,         quand: dimanche après 04:00,      evenement: export_finances }
  - { page: academy,           quand: jeudi après 09:00,         evenement: export_academie, page_typee_reelle: "parfois la page finances (26/10)", apres_export: "lire gold.bv_academy_chat depuis le dernier rapport (carte academie)" }
  - { page: transfers,         quand: si plus de 24 h,           evenement: export_marche }
  - { page: transfers_global-history, quand: avec le marché,     evenement: export_marche }

domaines:
  equipe:          { present: oui }
  tactique:        { present: oui }
  entrainement:    { present: oui, dimensions: [principale, secondaire], frequence: hebdomadaire }
  jeunes:          { present: oui, depense_suivie: oui, specificites: "jauge 0–100 %, investissement hebdo jusqu'à 100 000, test de potentiel 25 000, recrutement −50 % de jauge" }
  transferts:      { present: oui, taxe: "5 %", delai_revente: "1 semaine", minimum_effectif: 8, base_historique: transfers_global-history }   # 8 = règle du jeu ; 9 = notre marge de sécurité
  finances:        { present: oui, sponsor: "un contrat par saison" }
  personnel:       { present: oui, postes: [médecins, kinés, psychologues, marketing], facturation: "maximum atteint dans la semaine (dev 2026-09-14 ; 85 000 contre 60 000 le 25/10, à confirmer le 01/11)" }
  infrastructures: { present: non }

core:   # refonte v2 phase 1 : entités branchées (adapt.basketvibe_<entité>) ; limites = colonnes nulles par construction
  player_daily:  { limites: [morale, suspended, contract_end, market_value] }   # absents de la collecte
  fixture:       { limites: [] }                                                 # scheduled_at : amicaux programmés seulement (fuseau de kickoff_time non sourcé)
  standing:      { limites: [] }
  finance_daily: { limites: [income, wage_cap, capacite_invest] }                # recettes non relevées ; aucun plafond dans les skills ; capacité calculée en gold
  market_listing: { limites: [] }                                                # enchères vues (marché et mes ventes) ; statut figé au dernier relevé
  academy_prospect: { limites: [potential_min, potential_max] }                  # rapport du scout ; potentiel caché non affiché ; tous « candidat » (signatures non collectées)
  training_plan: { limites: [intensity] }                                        # pas d'intensité dans le jeu

vues_gold:
  agenda: gold.bv_agenda
  alertes: gold.bv_daily_alerts
  rapport_match: gold.bv_match_report
  saisie_tactique: [gold.bv_saisie_joueurs, gold.bv_saisie_adversaires]   # R-10, ordre de l'écran, ligue/coupe/amical
  base_transferts: null          # à créer
  resultat_champ: my_result

specificites:
  - { regle: "Ligue et amicaux non comparables : fatigue et expérience d'un amical ≈ 1/10", source: "manuel M§1.2", statut: confirmé }
  - { regle: "Ne pas mélanger v3 et v4 dans les tendances", source: "news 2026-10-19", statut: confirmé }
  - { regle: "Re-sélectionner le preset sur chaque match de ligue déjà planifié", source: "fiche tactique", statut: confirmé }
