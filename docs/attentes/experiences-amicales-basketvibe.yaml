# File d'expériences amicales BasketVibe (critère H1, étape 5d, docs/refonte-v3/journal-aujourdhui.md).
# Source : docs/refonte-v3/playbook-basketvibe.md, section « File d'expériences amicales » ; E1 validée par l'utilisateur le 2026-11-09.
# Lu par pipelines/aujourdhui_sources.py (lire_experiences) : les expériences passent dans l'ordre du fichier ;
# la suivante démarre quand la précédente a `amicaux_vises` amicaux VÉRIFIÉS (étape 5g, M3) : ligne
# `[expérience=<id>:<niveau>]` du registre fait-<jour>.md ET réglage joué conforme dans gold.bv_amical_reglage.
# `ordre` donne le niveau de chaque amical, répété si la liste est plus courte que `amicaux_vises`.
# `niveaux` : texte saisi à l'écran pour ce niveau (affiché tel quel dans le plan du jour).
# `joue` : réglage attendu dans gold.bv_amical_reglage, en crans de l'API (écran = cran + 1, docs/fiches/basketvibe/match.md:19).
#   agress_cran = agressivité uniforme des joueurs de Q1-Q4 ; tir_cran4_min = nombre minimal de joueurs au focus de tir cran 4 ;
#   primary_quarts_min = quarts-temps (sur 4) avec un joueur au focus offensif Primary (cran 4). Vide : tout amical joué compte.
# Niveaux de l'étude (etude-evenements-basketvibe.md:135 et :218) = crans de l'API : E1 « 2 puis 4 » = écran 3 puis 5 (étape 5g, M1).
# `debut` (M4) : aucun amical joué avant cette date ne compte. E1 validée le 2026-11-09 vers 16:00 Paris (journal 5d) ;
#   l'amical du 09/11 (Garden City) était déjà joué.
# `lecons` (étape 6b, S2) : leçons de learn.lesson que le verdict de l'expérience met à jour (identifiants courts,
#   préfixe `basketvibe:` en base). Classement : docs/refonte-v3/journal-aujourdhui.md, « Revue hebdomadaire, étape 6b », S1.
#   Liste vide : aucune hypothèse ne correspond ; la leçon à créer est proposée en commentaire, jamais écrite en base ici.
debut: 2026-11-10
experiences:
  - id: E1
    reglage: agressivité défensive, uniforme sur nos cinq
    niveaux:
      A: agressivité 3 à l'écran (cran 2, équilibrée) sur tous les joueurs
      B: agressivité 5 à l'écran (cran 4, agressive) sur tous les joueurs
    joue:
      A: {agress_cran: 2}
      B: {agress_cran: 4}
    ordre: [A, B, A, B]
    amicaux_vises: 4
    # 5j (Y4) : valeurs qui ne bougent pas pendant E1 ; pipelines/composition.py les écrit « constant pendant E1 » sous le tableau.
    constants: {zone: Perimeter, focus: 3}
    lecons: [L-004, L-008, L-011#2, L-015, L-021]
    export_requis: [aperçu, box scores par quart-temps, réglages utilisés, page Équipe du jour]
  - id: E5
    reglage: zone défensive (Perimeter, Middle, Rim), alternée par match
    niveaux:
      A: zone Perimeter (1) sur les adversaires
      B: zone Middle (3) sur les adversaires
      C: zone Rim (5) sur les adversaires
    # `zone` : zone saisie par niveau ; `constants` : le focus défensif reste 3 (Normal) pour tous les adversaires.
    # Aucun test du focus défensif par joueur adverse : aucun aperçu en amical (arbitrage 15).
    # Limite : gold.bv_amical_reglage n'a pas de colonne zone, `joue` reste vide : E5 est vérifiée par le registre seul.
    zone: {A: Perimeter, B: Middle, C: Rim}
    constants: {focus: 3}
    ordre: [A, B, C]
    amicaux_vises: 3
    # leçon à créer (proposée) : « La zone défensive change le pourcentage à 2 points adverse (Perimeter 45-55 %, Middle 64-66 %
    #   en amical, L-027) » ; aucune leçon existante n'y répond.
    lecons: []
    export_requis: [aperçu, box scores par quart-temps, réglages utilisés, page Équipe du jour]
  - id: E2
    reglage: focus de tir de deux tireurs
    niveaux:
      A: focus de tir 5 à l'écran (cran 4, 3 pts) sur deux tireurs
      B: focus de tir 3 à l'écran (cran 2, référence, déjà en base)
    joue:
      A: {tir_cran4_min: 2}
    ordre: [A]
    amicaux_vises: 3
    lecons: [L-002, L-020, L-025]
    export_requis: [aperçu, box scores par quart-temps, réglages utilisés, page Équipe du jour]
  - id: E3
    reglage: focus offensif Primary à chaque quart-temps
    niveaux:
      A: focus offensif Primary (5 à l'écran) à chaque quart-temps
      B: focus offensif Normal (référence, déjà en base)
    joue:
      A: {primary_quarts_min: 4}
    ordre: [A]
    amicaux_vises: 7
    # leçon à créer (proposée) : « Un joueur au focus offensif Primary tente environ 1,33 fois les tirs d'un joueur Normal
    #   sur le même quart [M§6.3] » (chiffre 6 de l'étude).
    lecons: []
    export_requis: [aperçu, box scores par quart-temps, réglages utilisés, page Équipe du jour]
  - id: E4
    reglage: aucun (réglage habituel)
    niveaux:
      habituel: réglage habituel, rien ne change
    ordre: [habituel]
    amicaux_vises: 16
    # leçon à créer (proposée) : « La réussite à 3 points de nos tireurs monte avec leur compétence Trois points, à type de
    #   tir égal » (chiffre 1 de l'étude, 871 tirs requis en v5).
    lecons: []
    export_requis: [aperçu, box scores par quart-temps, réglages utilisés, page Équipe du jour]
